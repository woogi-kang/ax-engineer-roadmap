name: External link health

on:
  pull_request:
    paths:
      - "**/*.md"
      - "research/public-ax-cases.json"
      - "scripts/check-external-links.mjs"
      - ".github/workflows/external-links.yml"
  schedule:
    - cron: "13 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check external links
        run: npm run check:external
