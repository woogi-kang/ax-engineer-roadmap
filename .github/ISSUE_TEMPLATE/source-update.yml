name: Source update
description: 오래되거나 잘못 연결된 출처와 주장을 수정합니다. / Correct an outdated or incorrect source or claim.
title: "[Source] "
labels:
  - source
body:
  - type: input
    id: file
    attributes:
      label: 관련 파일 / Related file
      placeholder: roadmap/role-model.md
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 주장 또는 링크 / Current claim or link
    validations:
      required: true
  - type: textarea
    id: replacement
    attributes:
      label: 새 근거와 확인일 / New evidence and verification date
    validations:
      required: true
  - type: textarea
    id: dates_and_method
    attributes:
      label: 발표일·관측기간·측정 방법 / Publication, observation period, and method
      description: 발표일과 실제 관측기간을 구분하고 표본·분모·접근 상태·성과 검증 수준을 적어 주세요. 모르면 unknown으로 표시합니다. / Separate publication from observation, and record sample, denominator, access, and outcome verification. Mark unknown values explicitly.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 무엇을 바꿔야 하나요? / What should change?
    validations:
      required: true
